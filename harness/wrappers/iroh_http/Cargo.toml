[package]
name = "iroh_http"
version = "0.1.0"
edition = "2021"
description = "HttpKV wrapper (see bench/adapters.py) around one iroh-docs replica"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
iroh = "1"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = { version = "0.101", features = ["net"] }
n0-future = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
